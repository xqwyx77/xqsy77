<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小七游戏 · 维护中</title>
<meta name="description" content="小七游戏站点临时维护中，正在整理新的游戏内容与图集，稍后回来。">
<meta name="theme-color" content="#26221F">
<meta name="baidu-site-verification" content="codeva-enFO51wfS7" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<style>
  :root{
    --bg:#26221F; --bg2:#2B2723; --ink:#EFE8DC; --ink2:#BFB6A8;
    --brass:#C8A35E; --line:rgba(239,232,220,.14);
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","Microsoft YaHei",serif;
    --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-weight:300; line-height:1.7;
    display:flex; align-items:center; justify-content:center; padding:32px 24px;
    background-image:
      radial-gradient(820px 600px at 12% 4%, rgba(95,168,211,.09), transparent 65%),
      radial-gradient(900px 720px at 96% 32%, rgba(200,163,94,.10), transparent 65%);
  }
  .card{
    width:100%; max-width:560px; text-align:center;
    border:1px solid var(--line); border-radius:22px;
    background:var(--bg2); padding:48px 36px 40px;
  }
  .logo{width:72px;height:72px;margin:0 auto 22px}
  .brand{font-family:var(--serif); font-weight:900; font-size:26px; letter-spacing:.06em}
  .brand small{display:block; font-family:var(--sans); font-weight:300; font-size:12px; letter-spacing:.28em; color:var(--ink2); margin-top:4px}
  .eyebrow{margin-top:26px; font-size:12px; letter-spacing:.24em; color:var(--brass)}
  h1{font-family:var(--serif); font-weight:900; font-size:34px; margin:10px 0 14px; letter-spacing:.04em}
  p.lede{color:var(--ink2); font-size:15px; max-width:380px; margin:0 auto}
  .meta{margin-top:28px; display:flex; flex-direction:column; gap:10px; align-items:center; font-size:14px}
  .meta a{color:var(--brass); text-decoration:none; letter-spacing:.04em}
  .meta a:hover{text-decoration:underline}
  .foot{margin-top:30px; font-size:12px; letter-spacing:.18em; color:var(--ink2)}
  @media (max-width:480px){ .card{padding:38px 24px 30px} h1{font-size:28px} }
</style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="15" fill="#26221F"/>
      <rect x="16" y="10" width="32" height="44" rx="8" fill="#E8DFC8"/>
      <rect x="20" y="15" width="24" height="16" rx="2" fill="#1A1712"/>
      <text x="32" y="28" text-anchor="middle" font-family="serif" font-weight="900" font-size="14" fill="#E8D5A8">七</text>
      <g fill="#433018"><rect x="22" y="38" width="3" height="9" rx="1"/><rect x="19.5" y="40.5" width="8" height="3" rx="1"/></g>
      <circle cx="41" cy="39" r="2.6" fill="#D9534F"/>
      <circle cx="45.5" cy="42.5" r="2.6" fill="#4A9FD8"/>
      <rect x="24" y="48.5" width="16" height="1.5" rx="0.75" fill="#433018" opacity=".3"/>
    </svg>
    <div class="brand">小七游戏<small>QI'S GAME ROOM</small></div>
    <p class="eyebrow">MAINTENANCE / 临时维护</p>
    <h1>站点维护中</h1>
    <p class="lede">小七正在整理新的游戏内容与图集，稍后就回来。给你带来不便，先道一声抱歉。</p>
    <div class="meta">
      <a href="https://xqsy77.com/">https://xqsy77.com/</a>
      <a href="mailto:2930865308@qq.com">2930865308@qq.com</a>
    </div>
    <p class="foot">小七游戏 · 2026</p>
  </main>
</body>
</html>
